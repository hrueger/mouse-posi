name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS ARM
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-cmake-qt-opencv-v1
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Install Homebrew dependencies
        run: brew install cmake qt opencv

      - name: Install NDI SDK
        run: |
          curl -L "${{ secrets.NDI_SDK_URL_MAC }}" -o ndi-sdk.pkg
          sudo installer -pkg ndi-sdk.pkg -target /

      - name: Import signing certificate
        # Requires secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix opencv)"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Bundle
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/onpoint.app

      - name: Strip Homebrew rpaths from bundle
        # macdeployqt bundles Homebrew OpenCV libs but leaves their original
        # LC_RPATH entries intact.  At runtime dyld resolves @rpath/libopencv_*
        # references against those paths and loads a second OpenCV/libomp stack
        # alongside the bundled one, triggering an OMP abort().
        # Strip every /opt/homebrew rpath from the executable and bundled libs.
        run: |
          exe="build/onpoint.app/Contents/MacOS/onpoint"
          install_name_tool -delete_rpath /opt/homebrew/opt/opencv/lib "$exe" 2>/dev/null || true
          install_name_tool -delete_rpath /opt/homebrew/lib "$exe" 2>/dev/null || true
          for lib in build/onpoint.app/Contents/Frameworks/libopencv_*.dylib; do
            [ -f "$lib" ] || continue
            otool -l "$lib" \
              | awk '/LC_RPATH/{ok=1} ok && /^ +path /{print $2; ok=0}' \
              | grep '^/opt/homebrew/' \
              | while IFS= read -r rpath; do
                  install_name_tool -delete_rpath "$rpath" "$lib" 2>/dev/null || true
                done
          done

      - name: Sign
        # Skipped if APPLE_SIGNING_IDENTITY secret is not set.
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --deep \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements src/macos/entitlements.plist \
            build/onpoint.app

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          cp -R build/onpoint.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "OnPoint" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            OnPoint.dmg

      - name: Sign DMG
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: codesign --sign "$APPLE_SIGNING_IDENTITY" OnPoint.dmg

      - name: Notarize DMG
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit OnPoint.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple OnPoint.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnPoint-macOS
          path: OnPoint.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"
          cache: true

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-opencv4-x64-windows-v2

      - name: Install OpenCV via vcpkg
        shell: pwsh
        run: vcpkg install "opencv4:x64-windows" --no-print-usage

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-opencv4-x64-windows-v2

      - name: Install NDI SDK
        # The NDI installer is Inno Setup (no /S flag); use innoextract to unpack
        # without a GUI, then point NDI_SDK_DIR at the extracted app/ directory.
        shell: pwsh
        run: |
          $url = "${{ secrets.NDI_SDK_URL_WIN }}"
          $installer = Join-Path $env:RUNNER_TEMP "ndi-sdk.exe"
          curl.exe -L --retry 3 --retry-delay 5 $url -o $installer

          choco install innoextract -y --no-progress
          $extract = Join-Path $env:RUNNER_TEMP "ndi-sdk"
          & innoextract $installer --output-dir $extract
          if ($LASTEXITCODE -ne 0) { throw "innoextract failed with exit code $LASTEXITCODE" }

          $appDir = Join-Path $extract "app"
          if (-not (Test-Path $appDir)) {
            Get-ChildItem $extract -Depth 3 | Select-Object FullName
            throw "Expected app/ directory not found after extraction"
          }
          "NDI_SDK_DIR=$appDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Bonjour SDK
        # Installs Bonjour runtime, fetches dns_sd.h (Apache 2.0 from mDNSResponder),
        # and generates dnssd.lib from the installed DLL via dumpbin + lib.exe.
        shell: pwsh
        run: |
          choco install bonjour -y --no-progress

          New-Item -ItemType Directory -Force "third_party\bonjour\Include"
          New-Item -ItemType Directory -Force "third_party\bonjour\Lib\x64"

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/apple-oss-distributions/mDNSResponder/main/mDNSShared/dns_sd.h" `
            -OutFile "third_party\bonjour\Include\dns_sd.h"

          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $msvc = (Get-ChildItem "$vsPath\VC\Tools\MSVC" |
                   Sort-Object Name -Descending | Select-Object -First 1).FullName
          $dumpbin = "$msvc\bin\Hostx64\x64\dumpbin.exe"
          $lib     = "$msvc\bin\Hostx64\x64\lib.exe"

          $exports = (& $dumpbin /exports "C:\Windows\System32\dnssd.dll") |
            Where-Object { $_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+\w' } |
            ForEach-Object { (($_ -split '\s+', 5)[4]).Trim() } |
            Where-Object { $_ }

          @("LIBRARY dnssd", "EXPORTS") + $exports |
            Set-Content "third_party\bonjour\Lib\x64\dnssd.def" -Encoding ascii

          & $lib /def:"third_party\bonjour\Lib\x64\dnssd.def" `
                 /machine:x64 `
                 /out:"third_party\bonjour\Lib\x64\dnssd.lib"

      - name: Configure
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime "build\Release\onpoint.exe"
          Copy-Item "C:\Windows\System32\dnssd.dll" "build\Release\" -Force
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\opencv_*.dll" "build\Release\" -Force

      - name: Create installer
        run: |
          $version = if ("${{ github.ref_name }}" -match '^v(.+)$') { $Matches[1] } else { "0.0.0" }
          makensis /DVERSION="$version" packaging\windows.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnPoint-Windows
          path: OnPoint-*-Setup.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            curl \
            file \
            unzip \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libopencv-dev \
            libavahi-compat-libdnssd-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtmultimedia"
          cache: true

      - name: Install NDI SDK
        env:
          NDI_SDK_URL_LINUX: ${{ secrets.NDI_SDK_URL_LINUX }}
        run: bash .github/scripts/install-ndi-linux.sh

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$PWD/package/OnPoint-Linux-x86_64"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package
        run: |
          mkdir -p package/OnPoint-Linux-x86_64/bin package/OnPoint-Linux-x86_64/lib package/OnPoint-Linux-x86_64/share/doc/onpoint
          cp build/onpoint package/OnPoint-Linux-x86_64/bin/
          cp -a ndi/lib/libndi.so* package/OnPoint-Linux-x86_64/lib/
          cp README.md package/OnPoint-Linux-x86_64/share/doc/onpoint/ 2>/dev/null || true
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo 'APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            echo 'export LD_LIBRARY_PATH="$APPDIR/lib:${LD_LIBRARY_PATH:-}"'
            echo 'exec "$APPDIR/bin/onpoint" "$@"'
          } > package/OnPoint-Linux-x86_64/run-onpoint.sh
          chmod +x package/OnPoint-Linux-x86_64/run-onpoint.sh
          tar -C package -czf OnPoint-Linux-x86_64.tar.gz OnPoint-Linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnPoint-Linux-x86_64
          path: OnPoint-Linux-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            OnPoint.dmg
            OnPoint-*-Setup.exe
            OnPoint-Linux-x86_64.tar.gz
